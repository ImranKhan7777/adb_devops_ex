services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: adbapp
      POSTGRES_USER: adbuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdevpassword}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adbuser -d adbapp"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: adbapp
      DB_USER: adbuser
      DB_PASSWORD: ${DB_PASSWORD:-localdevpassword}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
