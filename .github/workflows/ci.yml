name: DevOps CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke-test:
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r app/requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -v app/tests

      - name: Build and start application stack
        run: docker compose up -d --build

      - name: Smoke test application
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Application health check failed"
              docker compose logs
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://localhost:8080/db-health
          echo "Smoke tests passed"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop application stack
        if: always()
        run: docker compose down -v
